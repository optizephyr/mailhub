# 扫描范围
lookback_days: 14
mail_limit: 80

# 提醒：开始前多少分钟
reminder_minutes: 30

# 本地无记录时，回到日历里找已有日程的时间窗（天）；0 关闭
calendar_scan_days: 90

# 邮箱实例 id（多邮箱时区分 checkpoint）
source_id: qq.default

# 精确匹配 CalDAV collection 的显示名称；留空即未启用该渠道
calendar_name: 秋招
reminders_list: 秋招

# 可选 LLM 模型名；是否启用看环境变量 LLM_API_BASE + LLM_API_KEY
llm_model: MiniMax-M2.7-highspeed
