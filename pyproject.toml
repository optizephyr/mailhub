[project]
name = "mailhub"
version = "0.2.0"
description = "邮件处理中心：拉取邮箱、筛选重要邮件，并通过日程等方式提醒"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "imap-tools>=1.7.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
    # 系统 Python 3.9 的 ssl 基于 LibreSSL 2.8.3，urllib3 2.x 要求 OpenSSL 1.1.1+
    "urllib3<2",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
mailhub = "mailhub.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mailhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true
