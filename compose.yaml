# 部署项来自同目录 .env；旋钮挂仓库内 config.yaml（构建时也会打进镜像）。
# 同一 source_id 任意时刻只跑一个写入方。
services:
  mailhub:
    image: ghcr.io/optizephyr/mailhub:latest
    build: .
    env_file: .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    init: true
    stop_grace_period: 1m
    # 每 15 分钟跑一次；改间隔只动这里，不必重建业务配置
    command:
      - sh
      - -c
      - while true; do mailhub sync; sleep 900; done
