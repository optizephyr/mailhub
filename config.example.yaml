# QQ 邮箱（设置 → 账户 → 开启 IMAP/SMTP → 生成授权码）
qq_email: your@qq.com
qq_auth_code: your_qq_auth_code

# 邮箱实例 id（多邮箱时区分 checkpoint）
source_id: qq.default

# 第三方 CalDAV 账户（日历与提醒事项共用）
caldav_url: https://dav.example.com/
caldav_username: your_username
caldav_password: your_app_password

# 精确匹配 CalDAV collection 的显示名称；留空即未启用该渠道
calendar_name: 秋招
reminders_list: 秋招提醒

# Bark 即时推送（默认未启用；仅支持自建服务器和一台设备）
bark_enabled: false
bark_server_url: https://bark.your-domain.example
bark_key: your_device_key

# 扫描范围
lookback_days: 14
mail_limit: 80

# 提醒：开始前多少分钟
reminder_minutes: 30

# 本地无记录时，回到日历里找已有日程的时间窗（天）；0 关闭
calendar_scan_days: 90

# 可选：任意 OpenAI Chat Completions 兼容接口
# 启用后：秋招策略先规则粗过滤，再调 LLM
# 生命周期：data/logs/mail_lifecycle.jsonl ；LLM 原文：data/logs/llm_io.jsonl
# llm_api_base: https://your-provider.example/v1
# llm_api_key:
# llm_model: gpt-4o-mini